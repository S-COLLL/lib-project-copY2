# Render Blueprint for the Java (Spring Boot) version — New → Blueprint → pick this repository and
# the java-fullstack branch. Render asks for the values marked "sync: false" (your cloud MySQL details).
services:
  - type: web
    name: smartlib-java
    runtime: docker
    plan: free
    dockerfilePath: ./java-backend/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TRUST_PROXY
        value: "1"
      - key: MYSQL_POOL_SIZE
        value: "5"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: defaultdb
      # Paste the CA certificate text from your MySQL provider (Aiven: "CA certificate").
      - key: MYSQL_SSL_CA
        sync: false
