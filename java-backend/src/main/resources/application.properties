# SmartLib (Spring Boot). Settings come from environment variables, or from a .env file
# (KEY=value lines) in this folder or the repository root — the same keys the Node.js version used:
#   PORT, JWT_SECRET, JWT_EXPIRES_IN, MYSQL_HOST, MYSQL_PORT, MYSQL_USER, MYSQL_PASSWORD,
#   MYSQL_DATABASE, MYSQL_SSL_CA, MYSQL_POOL_SIZE, TRUST_PROXY, APP_ENV / NODE_ENV
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

spring.application.name=smartlib
server.port=${PORT:3000}
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml

# Unknown pages and API routes are answered by ErrorHandler (404 JSON for /api, sign-in page otherwise).
spring.web.resources.add-mappings=true
spring.mvc.problemdetails.enabled=false
server.error.whitelabel.enabled=false

spring.main.banner-mode=off
logging.level.com.zaxxer.hikari=WARN
